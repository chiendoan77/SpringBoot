<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Quản lý sản phẩm</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 10vh auto; padding: 24px; }
        label, input, button { display: block; width: 100%; box-sizing: border-box; }
        input, button { margin-top: 8px; padding: 10px; }
        label { margin-top: 16px; }
        #message { color: #b42318; }
    </style>
</head>
<body>
<h1>Đăng nhập</h1>
<form id="loginForm">
    <label for="userName">Tên đăng nhập</label>
    <input id="userName" name="userName" autocomplete="username" required>
    <label for="password">Mật khẩu</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Đăng nhập</button>
</form>
<p id="message" role="alert"></p>

<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    message.textContent = "";

    const body = new URLSearchParams(new FormData(form));
    try {
        const response = await fetch("/auth", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body
        });
        const data = await response.json();
        if (!response.ok || !data.token) {
            message.textContent = data.message || "Đăng nhập thất bại.";
            return;
        }

        localStorage.setItem("token", data.token);
        window.location.replace("/home.html");
    } catch {
        message.textContent = "Không thể kết nối đến máy chủ.";
    }
});
</script>
</body>
</html>
