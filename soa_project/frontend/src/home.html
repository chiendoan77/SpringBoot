<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 32px auto; padding: 0 16px; }
        header { display: flex; justify-content: space-between; align-items: center; }
        form { display: grid; gap: 10px; max-width: 520px; margin: 24px 0; }
        input, textarea, button { padding: 9px; }
        textarea { min-height: 70px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 9px; text-align: left; }
        #status { min-height: 1.4em; }
    </style>
</head>
<body>
<header>
    <h1>Quản lý sản phẩm</h1>
    <button id="logoutButton" type="button">Đăng xuất</button>
</header>

<h2 id="formTitle">Thêm sản phẩm</h2>
<form id="productForm">
    <input id="productId" type="hidden">
    <label for="name">Tên sản phẩm</label>
    <input id="name" maxlength="255" required>
    <label for="description">Mô tả</label>
    <textarea id="description" maxlength="65535"></textarea>
    <label for="price">Giá</label>
    <input id="price" type="number" min="0" step="0.01" required>
    <label for="quantity">Số lượng</label>
    <input id="quantity" type="number" min="0" step="1" required>
    <div>
        <button id="saveButton" type="submit">Thêm sản phẩm</button>
        <button id="cancelButton" type="button" hidden>Hủy sửa</button>
    </div>
</form>

<p id="status" role="status"></p>
<h2>Danh sách sản phẩm</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Mô tả</th>
        <th>Giá</th>
        <th>Số lượng</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody id="products"></tbody>
</table>

<script>
const token = localStorage.getItem("token");
if (!token) {
    window.location.replace("/login.html");
}

const form = document.getElementById("productForm");
const statusElement = document.getElementById("status");
const productList = document.getElementById("products");

async function api(path, options = {}) {
    const response = await fetch(path, {
        ...options,
        headers: {
            ...(options.headers || {}),
            "Authorization": `Bearer ${token}`
        }
    });

    if (response.status === 401) {
        localStorage.removeItem("token");
        window.location.replace("/login.html");
        throw new Error("Phiên đăng nhập đã hết hạn.");
    }
    return response;
}

async function loadProducts() {
    try {
        const response = await api("/products");
        if (!response.ok) {
            throw new Error("Không tải được danh sách sản phẩm.");
        }

        const products = await response.json();
        productList.replaceChildren();
        for (const product of products) {
            const row = document.createElement("tr");
            for (const value of [
                product.id,
                product.name,
                product.description || "",
                Number(product.price).toFixed(2),
                product.quantity
            ]) {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            }

            const actions = document.createElement("td");
            const editButton = document.createElement("button");
            editButton.type = "button";
            editButton.textContent = "Sửa";
            editButton.addEventListener("click", () => editProduct(product));
            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.textContent = "Xóa";
            deleteButton.addEventListener("click", () => deleteProduct(product.id));
            actions.append(editButton, deleteButton);
            row.appendChild(actions);
            productList.appendChild(row);
        }
    } catch (error) {
        statusElement.textContent = error.message;
    }
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const id = document.getElementById("productId").value;
    const product = {
        name: document.getElementById("name").value,
        description: document.getElementById("description").value,
        price: Number(document.getElementById("price").value),
        quantity: Number(document.getElementById("quantity").value)
    };

    try {
        const response = await api(id ? `/products/${id}` : "/products", {
            method: id ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(product)
        });
        if (!response.ok) {
            throw new Error(response.status === 400
                ? "Dữ liệu sản phẩm không hợp lệ."
                : "Không thể lưu sản phẩm.");
        }
        statusElement.textContent = id ? "Đã cập nhật sản phẩm." : "Đã thêm sản phẩm.";
        resetForm();
        await loadProducts();
    } catch (error) {
        statusElement.textContent = error.message;
    }
});

function editProduct(product) {
    document.getElementById("productId").value = product.id;
    document.getElementById("name").value = product.name;
    document.getElementById("description").value = product.description || "";
    document.getElementById("price").value = product.price;
    document.getElementById("quantity").value = product.quantity;
    document.getElementById("formTitle").textContent = "Cập nhật sản phẩm";
    document.getElementById("saveButton").textContent = "Lưu thay đổi";
    document.getElementById("cancelButton").hidden = false;
    document.getElementById("name").focus();
}

async function deleteProduct(id) {
    if (!window.confirm("Bạn có chắc muốn xóa sản phẩm này?")) {
        return;
    }
    try {
        const response = await api(`/products/${id}`, { method: "DELETE" });
        if (!response.ok) {
            throw new Error("Không thể xóa sản phẩm.");
        }
        statusElement.textContent = "Đã xóa sản phẩm.";
        await loadProducts();
    } catch (error) {
        statusElement.textContent = error.message;
    }
}

function resetForm() {
    form.reset();
    document.getElementById("productId").value = "";
    document.getElementById("formTitle").textContent = "Thêm sản phẩm";
    document.getElementById("saveButton").textContent = "Thêm sản phẩm";
    document.getElementById("cancelButton").hidden = true;
}

document.getElementById("cancelButton").addEventListener("click", resetForm);
document.getElementById("logoutButton").addEventListener("click", () => {
    localStorage.removeItem("token");
    window.location.replace("/login.html");
});

loadProducts();
</script>
</body>
</html>
