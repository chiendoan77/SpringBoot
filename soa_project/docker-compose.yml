services:
  frontend:
    image: soa-project-frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  api-gateway:
    image: soa-project-api-gateway
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      PRODUCT_SERVICE_URL: http://product-data-service:8085
      ORDER_SERVICE_URL: http://order-service:8088
      REPORTING_SERVICE_URL: http://reporting-service:8089
    depends_on:
      - auth-service
      - product-data-service
      - order-service
      - reporting-service
    restart: unless-stopped

  auth-service:
    image: soa-project-auth-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: auth-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-deployment-32-bytes}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-change-me-local}
    restart: unless-stopped

  product-data-service:
    image: soa-project-product-data-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: product-data-service
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-deployment-32-bytes}
    volumes:
      - product-data:/app/data
    restart: unless-stopped

  order-service:
    image: soa-project-order-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: order-service
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-deployment-32-bytes}
      PRODUCT_SERVICE_URL: http://product-data-service:8085
    depends_on:
      - product-data-service
    volumes:
      - order-data:/app/data
    restart: unless-stopped

  reporting-service:
    image: soa-project-reporting-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: reporting-service
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-deployment-32-bytes}
      PRODUCT_SERVICE_URL: http://product-data-service:8085
      ORDER_SERVICE_URL: http://order-service:8088
    depends_on:
      - product-data-service
      - order-service
    restart: unless-stopped

volumes:
  product-data:
  order-data:
